name: Publish Semrush Metrics UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-dashboard-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject dashboard metrics UI
        run: python3 scripts/inject_semrush_metrics_ui.py

      - name: Commit dashboard update
        run: |
          if git diff --quiet -- index.html; then
            echo "Dashboard metrics UI is already published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Semrush keyword metrics to dashboard"
          git push
