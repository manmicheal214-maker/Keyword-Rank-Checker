name: Apply Rank Checker UI

on:
  push:
    branches:
      - main
      - feature/zenrows-rank-checker
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rank-checker-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inject-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject rank checker UI
        run: python3 scripts/inject_rank_checker_ui.py

      - name: Commit dashboard update
        run: |
          if git diff --quiet -- index.html; then
            echo "Rank checker UI is already published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add keyword rank checker UI"
          git push
