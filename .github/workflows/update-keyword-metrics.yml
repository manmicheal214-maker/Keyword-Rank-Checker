name: Update Semrush India Keyword Metrics

on:
  workflow_dispatch:
  schedule:
    # 09:00 India Standard Time (IST = UTC+5:30)
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: semrush-keyword-metrics
  cancel-in-progress: true

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Semrush v4 India keyword metrics
        env:
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
        run: python3 scripts/fetch_semrush_keyword_metrics.py

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/keyword_metrics.json
          if git diff --cached --quiet; then
            echo "No keyword metric changes to commit."
            exit 0
          fi
          git commit -m "Update Semrush India keyword metrics"
          git push
