name: Update Semrush Rankings

on:
  workflow_dispatch:
  schedule:
    # 09:00 India Standard Time (IST = UTC+5:30)
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: semrush-rankings
  cancel-in-progress: true

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Semrush Position Tracking data
        env:
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
        run: python3 scripts/fetch_semrush_rankings.py

      - name: Commit updated rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json
          if git diff --cached --quiet; then
            echo "No ranking changes to commit."
            exit 0
          fi
          git commit -m "Update Semrush rankings"
          git push
